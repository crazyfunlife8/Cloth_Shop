<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員管理｜後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --c-primary: #8f5935; --c-primary-dk: #754122;
      --c-surface: #FBF7F4; --c-body: #F5EFE6;
      --c-border: rgba(143,89,53,.18); --c-text: #3a2e24; --c-muted: #9E8B84;
      --c-danger: #c0392b; --c-success: #27ae60;
      --sidebar-w: 220px; --header-h: 60px;
    }
    html, body { height: 100%; }
    body { font-family: 'Nunito','Noto Sans TC',sans-serif; background: var(--c-body); color: var(--c-text); font-size: 14px; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; vertical-align: middle; font-size: 20px; }

    .admin-header {
      position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
      background: #fff; border-bottom: 1px solid var(--c-border);
      display: flex; align-items: center; padding: 0 24px; gap: 16px; z-index: 100;
    }
    .admin-brand { font-weight: 800; font-size: 18px; color: var(--c-primary); display: flex; align-items: center; }
    .admin-brand span { font-weight: 400; font-size: 13px; color: var(--c-muted); }

    .admin-sidebar {
      position: fixed; top: var(--header-h); left: 0; bottom: 0;
      width: var(--sidebar-w); background: #fff; border-right: 1px solid var(--c-border);
      padding: 20px 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .sidebar-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--c-muted); text-transform: uppercase; padding: 8px 12px 4px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-weight: 600; color: var(--c-text); transition: background .15s; }
    .sidebar-link:hover { background: var(--c-body); }
    .sidebar-link.active { background: rgba(143,89,53,.1); color: var(--c-primary); }

    .admin-main { margin-top: var(--header-h); margin-left: var(--sidebar-w); padding: 28px; }
    .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .page-title { font-size: 20px; font-weight: 800; }
    .page-count { font-size: 13px; color: var(--c-muted); font-weight: 600; }

    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 200px; padding: 9px 14px;
      border: 1.5px solid var(--c-border); border-radius: 10px;
      background: #fff; font-family: inherit; font-size: 14px; color: var(--c-text); outline: none;
    }
    .search-input:focus { border-color: var(--c-primary); }

    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: #fff; border-radius: 14px; border: 1px solid var(--c-border);
      padding: 18px 20px;
    }
    .stat-label { font-size: 12px; color: var(--c-muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .stat-val { font-size: 28px; font-weight: 800; color: var(--c-primary); margin-top: 6px; }

    .table-wrap { background: #fff; border-radius: 14px; border: 1px solid var(--c-border); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--c-body); }
    th { padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c-muted); white-space: nowrap; }
    td { padding: 13px 16px; border-top: 1px solid var(--c-border); vertical-align: middle; }
    tr:hover td { background: rgba(143,89,53,.03); }

    .member-name { font-weight: 700; }
    .member-email { font-size: 13px; color: var(--c-muted); margin-top: 2px; }
    .badge-count {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(143,89,53,.1); color: var(--c-primary);
      font-weight: 800; font-size: 13px;
      min-width: 28px; height: 24px; border-radius: 999px; padding: 0 8px;
    }
    .spent { font-weight: 700; color: var(--c-primary); }
    .date-cell { font-size: 12.5px; color: var(--c-muted); white-space: nowrap; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--c-muted); }
    .empty-state .material-symbols-outlined { font-size: 40px; display: block; margin-bottom: 10px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--c-text); color: #fff; border-radius: 10px;
      padding: 10px 20px; font-size: 14px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header class="admin-header">
  <div class="admin-brand">𝑩𝒂𝒊𝑩𝒂𝒊 𝑺𝒕𝒐𝒓𝒆 &nbsp;<span>後台管理</span></div>
</header>

<aside class="admin-sidebar">
  <span class="sidebar-label">管理</span>
  <a class="sidebar-link" href="products.html">
    <span class="material-symbols-outlined">checkroom</span>商品管理
  </a>
  <a class="sidebar-link" href="orders.html">
    <span class="material-symbols-outlined">receipt_long</span>訂單管理
  </a>
  <a class="sidebar-link active" href="members.html">
    <span class="material-symbols-outlined">group</span>會員管理
  </a>
</aside>

<main class="admin-main">
  <div class="page-head">
    <h1 class="page-title">會員管理</h1>
    <span class="page-count" id="page-count"></span>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">總會員數</div>
      <div class="stat-val" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">回購會員</div>
      <div class="stat-val" id="stat-repeat">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">總消費金額</div>
      <div class="stat-val" id="stat-revenue">—</div>
    </div>
  </div>

  <div class="toolbar">
    <input class="search-input" type="search" id="search-input" placeholder="搜尋姓名 / Email / 手機…">
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>會員</th>
          <th>手機</th>
          <th>訂單數</th>
          <th>累計消費</th>
          <th>最後下單</th>
          <th>加入時間</th>
        </tr>
      </thead>
      <tbody id="members-tbody">
        <tr><td colspan="6"><div class="empty-state"><span class="material-symbols-outlined">hourglass_empty</span>載入中…</div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const API = 'https://brand-api.crazyfunlife8.workers.dev';
  let members = [];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function fmtDate(str) {
    if (!str) return '—';
    const d = new Date(str.replace(' ', 'T') + (str.includes('T') ? '' : 'Z'));
    return d.toLocaleDateString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' });
  }

  function renderMembers(list) {
    const tbody = document.getElementById('members-tbody');
    document.getElementById('page-count').textContent = `共 ${list.length} 筆`;
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><span class="material-symbols-outlined">group</span>尚無符合的會員</div></td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(m => `
      <tr>
        <td>
          <div class="member-name">${m.name || '—'}</div>
          <div class="member-email">${m.email}</div>
        </td>
        <td>${m.phone || '—'}</td>
        <td><span class="badge-count">${m.order_count}</span></td>
        <td class="spent">NT$${Number(m.total_spent).toLocaleString()}</td>
        <td class="date-cell">${fmtDate(m.last_order_at)}</td>
        <td class="date-cell">${fmtDate(m.created_at)}</td>
      </tr>
    `).join('');
  }

  async function loadMembers() {
    try {
      const res  = await fetch(`${API}/api/admin/members`, { credentials: 'include' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      members = data.members;

      // 統計
      const repeat  = members.filter(m => m.order_count > 1).length;
      const revenue = members.reduce((s, m) => s + Number(m.total_spent), 0);
      document.getElementById('stat-total').textContent   = members.length;
      document.getElementById('stat-repeat').textContent  = repeat;
      document.getElementById('stat-revenue').textContent = 'NT$' + revenue.toLocaleString();

      renderMembers(members);
    } catch (err) {
      document.getElementById('members-tbody').innerHTML =
        `<tr><td colspan="6"><div class="empty-state"><span class="material-symbols-outlined">error</span>${err.message || '載入失敗'}</div></td></tr>`;
    }
  }

  document.getElementById('search-input').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    renderMembers(q ? members.filter(m =>
      (m.name  || '').toLowerCase().includes(q) ||
      (m.email || '').toLowerCase().includes(q) ||
      (m.phone || '').includes(q)
    ) : members);
  });

  loadMembers();
</script>
</body>
</html>
