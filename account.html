<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員中心｜𝑩𝒂𝒊𝑩𝒂𝒊 𝑺𝒕𝒐𝒓𝒆 ღ</title>
  <meta name="theme-color" content="#FBF7F4">
  <link rel="icon" type="image/x-icon" href="/image/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/image/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/image/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/image/apple-touch-icon.png">
  <link rel="manifest" href="/image/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+TC:wght@500;600;700&family=Nunito:ital,wght@0,300..800;1,400..700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .account-page {
      max-width: 560px;
      margin: 0 auto;
      padding: 120px 20px 80px;
    }
    @media (min-width: 768px) { .account-page { padding: 140px 48px 100px; } }

    .page-title {
      font-family: 'Noto Serif TC', serif;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 600;
      color: var(--c-ft-dark);
      margin-bottom: 28px;
    }

    /* ── Form card ── */
    .form-card {
      background: var(--c-surface);
      border-radius: var(--r-card);
      padding: 28px;
      margin-bottom: 16px;
    }
    .form-card-title {
      font-weight: 700; font-size: 14px;
      color: var(--c-on-surface);
      margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .form-card-title .material-symbols-outlined { color: var(--c-primary); font-size: 18px; }

    .query-row { display: flex; gap: 10px; }
    .query-input {
      flex: 1; padding: 11px 14px;
      border: 1.5px solid rgba(143,89,53,.2);
      border-radius: var(--r-input);
      background: #fff; font-family: inherit;
      font-size: 14px; color: var(--c-on-surface);
      outline: none; transition: border-color .2s;
    }
    .query-input:focus { border-color: var(--c-primary); }
    .btn-query {
      padding: 11px 20px;
      background: var(--c-primary); color: #fff;
      border: none; border-radius: var(--r-input);
      font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: background .2s;
    }
    .btn-query:hover { background: var(--c-primary-dark); }
    .btn-query:disabled { opacity: .55; cursor: not-allowed; }
    .input-error { font-size: 12px; color: #c0392b; margin-top: 6px; display: none; }

    /* ── Divider ── */
    .section-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0;
    }
    .section-divider::before, .section-divider::after {
      content: ''; flex: 1; height: 1px; background: rgba(143,89,53,.15);
    }
    .section-divider span {
      font-size: 12px; font-weight: 700;
      color: var(--c-secondary); letter-spacing: .08em; white-space: nowrap;
    }

    /* ── Member view ── */
    .member-profile-card {
      background: var(--c-surface);
      border-radius: var(--r-card);
      padding: 28px;
      margin-bottom: 16px;
    }
    .member-profile-head {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 20px;
    }
    .member-avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(143,89,53,.12);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .member-avatar .material-symbols-outlined { font-size: 28px; color: var(--c-primary); }
    .member-greeting { flex: 1; min-width: 0; }
    .member-greeting-name {
      font-family: 'Noto Serif TC', serif;
      font-size: 18px; font-weight: 600; color: var(--c-ft-dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .member-greeting-sub { font-size: 12px; color: var(--c-secondary); margin-top: 2px; }
    .btn-logout {
      padding: 7px 14px;
      border: 1.5px solid rgba(143,89,53,.25);
      border-radius: var(--r-pill);
      background: #fff; font-family: inherit;
      font-size: 12px; font-weight: 700;
      color: var(--c-secondary); cursor: pointer;
      white-space: nowrap; transition: all .2s; flex-shrink: 0;
    }
    .btn-logout:hover { border-color: var(--c-primary); color: var(--c-primary); }

    .member-info-rows { display: flex; flex-direction: column; gap: 0; }
    .member-info-row {
      display: flex; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid rgba(143,89,53,.08);
      font-size: 13px;
    }
    .member-info-row:last-child { border-bottom: none; }
    .member-info-label { color: var(--c-secondary); }
    .member-info-val { font-weight: 600; color: var(--c-on-surface); }

    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: var(--c-surface); border-radius: var(--r-card);
      padding: 18px 20px; text-align: center;
    }
    .stat-label { font-size: 11px; color: var(--c-secondary); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .stat-val { font-size: 22px; font-weight: 800; color: var(--c-primary); margin-top: 6px; }

    .orders-section-title {
      font-weight: 700; font-size: 14px; color: var(--c-on-surface);
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .orders-section-title .material-symbols-outlined { font-size: 18px; color: var(--c-primary); }

    /* ── Order cards ── */
    .order-card {
      background: #fff; border-radius: 12px;
      padding: 16px 20px; margin-bottom: 10px;
      text-decoration: none; display: block; color: inherit;
      border: 1px solid rgba(143,89,53,.1);
      transition: box-shadow .2s;
    }
    .order-card:hover { box-shadow: 0 4px 20px rgba(74,43,39,.1); }
    .order-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .order-no { font-size: 13px; font-weight: 700; }
    .order-date { font-size: 12px; color: var(--c-secondary); margin-bottom: 4px; }
    .status-pill { display: inline-block; padding: 2px 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700; }
    .status-pending  { background: rgba(230,126,34,.15); color: #c0772a; }
    .status-paid     { background: rgba(39,174,96,.15);  color: #1e8449; }
    .status-shipped  { background: rgba(41,128,185,.15); color: #1a5e8a; }
    .status-done     { background: rgba(39,174,96,.15);  color: #1e8449; }
    .status-cancelled{ background: rgba(192,57,43,.15);  color: #922b21; }
    .order-items { font-size: 12px; color: var(--c-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .order-total { font-size: 14px; font-weight: 700; color: var(--c-primary); margin-top: 4px; }

    .result-msg { font-size: 14px; color: var(--c-secondary); text-align: center; padding: 24px 0; }
  </style>

<body>

<!-- HEADER -->
<header id="site-header">
  <nav class="header-nav">
    <a href="index.html" class="header-logo" aria-label="品牌首頁">
      <img src="/image/logo_mark.png" alt="BaiBai Store">
    </a>
    <div class="header-actions">
      <a href="index.html" class="icon-btn" aria-label="回首頁">
        <span class="material-symbols-outlined">home</span>
      </a>
      <button type="button" class="icon-btn" aria-label="購物車" onclick="Cart.open()">
        <span class="material-symbols-outlined">shopping_cart</span>
        <span id="cart-badge"></span>
      </button>
    </div>
  </nav>
</header>

<!-- CART DRAWER -->
<div id="cart-overlay" onclick="Cart.close()"></div>
<aside id="cart-drawer" aria-label="購物車">
  <div class="cart-head">
    <button class="cart-close" onclick="Cart.close()" aria-label="關閉購物車">
      <span class="material-symbols-outlined">close</span>
    </button>
    <p class="cart-title">SHOPPING CART <span style="color:#A85C55">♥</span></p>
    <span class="cart-subtitle">購 物 車</span>
  </div>
  <div class="cart-body" id="cart-body">
    <div class="cart-empty-state">
      <span class="material-symbols-outlined">shopping_cart</span>
      <p>購物車還空著</p>
      <a href="/#shop" onclick="Cart.close()">去逛逛 →</a>
    </div>
  </div>
  <div class="cart-foot">
    <div class="cart-total-box">
      <div class="cart-total-row">
        <span class="cart-total-label">小計</span>
        <span class="cart-total-amt" id="cart-total">NT$0</span>
      </div>
      <p class="cart-total-note">運費將於結帳時計算</p>
    </div>
    <a href="/checkout.html" class="cart-btn-checkout">前往結帳</a>
    <button class="cart-btn-continue" onclick="Cart.close()">繼續購物</button>
    <div class="cart-perks">
      <div class="cart-perk">
        <span class="material-symbols-outlined">local_shipping</span>
        <p class="cart-perk-title">滿額免運</p>
        <p class="cart-perk-desc">消費滿 NT$5,000<br>享免運優惠</p>
      </div>
      <div class="cart-perk">
        <span class="material-symbols-outlined">favorite</span>
        <p class="cart-perk-title">貼心服務</p>
        <p class="cart-perk-desc">有問題歡迎<br>聯繫客服</p>
      </div>
    </div>
  </div>
</aside>

<div id="toast"></div>

<main class="account-page">
  <h1 class="page-title">會員中心</h1>

  <!-- ── 訪客視圖 ── -->
  <div id="guest-view">

    <!-- 信箱登入 -->
    <div class="form-card">
      <p class="form-card-title">
        <span class="material-symbols-outlined">mail</span>以信箱登入
      </p>
      <div class="query-row">
        <input class="query-input" type="email" id="input-email"
               placeholder="輸入購物時填寫的信箱"
               onkeydown="if(event.key==='Enter') loginByEmail()">
        <button class="btn-query" id="btn-email" onclick="loginByEmail()">登入</button>
      </div>
      <p class="input-error" id="email-error"></p>
    </div>

    <div class="section-divider"><span>或以訪客身份查詢訂單</span></div>

    <!-- 手機查詢 -->
    <div class="form-card">
      <p class="form-card-title">
        <span class="material-symbols-outlined">phone</span>以手機號碼查詢
      </p>
      <div class="query-row">
        <input class="query-input" type="tel" id="input-phone"
               placeholder="09xx-xxxxxx"
               onkeydown="if(event.key==='Enter') queryByPhone()">
        <button class="btn-query" id="btn-phone" onclick="queryByPhone()">查詢</button>
      </div>
      <div id="phone-results"></div>
    </div>

    <!-- 訂單編號查詢 -->
    <div class="form-card">
      <p class="form-card-title">
        <span class="material-symbols-outlined">receipt_long</span>以訂單編號查詢
      </p>
      <div class="query-row">
        <input class="query-input" type="text" id="input-order-no"
               placeholder="ORD-20260908-XXXX"
               onkeydown="if(event.key==='Enter') queryByOrderNo()">
        <button class="btn-query" id="btn-order-no" onclick="queryByOrderNo()">查詢</button>
      </div>
      <div id="orderno-results"></div>
    </div>

  </div>

  <!-- ── 會員視圖 ── -->
  <div id="member-view" hidden>

    <!-- 個人資料 -->
    <div class="member-profile-card">
      <div class="member-profile-head">
        <div class="member-avatar">
          <span class="material-symbols-outlined">person</span>
        </div>
        <div class="member-greeting">
          <p class="member-greeting-name" id="member-name">—</p>
          <p class="member-greeting-sub">會員</p>
        </div>
        <button class="btn-logout" onclick="logout()">登出</button>
      </div>
      <div class="member-info-rows">
        <div class="member-info-row">
          <span class="member-info-label">信箱</span>
          <span class="member-info-val" id="member-email">—</span>
        </div>
        <div class="member-info-row">
          <span class="member-info-label">手機</span>
          <span class="member-info-val" id="member-phone">—</span>
        </div>
        <div class="member-info-row">
          <span class="member-info-label">加入時間</span>
          <span class="member-info-val" id="member-since">—</span>
        </div>
      </div>
    </div>

    <!-- 統計 -->
    <div class="stats-row">
      <div class="stat-card">
        <p class="stat-label">訂單數</p>
        <p class="stat-val" id="stat-order-count">—</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">累計消費</p>
        <p class="stat-val" id="stat-total-spent">—</p>
      </div>
    </div>

    <!-- 歷史訂單 -->
    <p class="orders-section-title">
      <span class="material-symbols-outlined">receipt_long</span>歷史訂單
    </p>
    <div id="member-orders"></div>

  </div>
</main>

<!-- footer 由 script.js renderFooter() 動態插入 -->

<script src="script.js"></script>
<script>
  const API = 'https://brand-api.crazyfunlife8.workers.dev';
  const STORAGE_KEY = 'ember_member_email';

  const STATUS_LABEL = {
    pending:'待付款', paid:'已付款',
    shipped:'已出貨', done:'已完成', cancelled:'已取消',
  };

  // ── 登入 ──
  async function loginByEmail() {
    const email = document.getElementById('input-email').value.trim().toLowerCase();
    const errEl = document.getElementById('email-error');
    errEl.style.display = 'none';
    if (!email) return;

    const btn = document.getElementById('btn-email');
    btn.disabled = true; btn.textContent = '查詢中…';

    try {
      const res  = await fetch(`${API}/api/members/me?email=${encodeURIComponent(email)}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '查詢失敗');
      localStorage.setItem(STORAGE_KEY, email);
      showMemberView(data);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = '登入';
    }
  }

  // ── 登出 ──
  function logout() {
    localStorage.removeItem(STORAGE_KEY);
    document.getElementById('guest-view').hidden  = false;
    document.getElementById('member-view').hidden = true;
    document.getElementById('input-email').value  = '';
  }

  // ── 顯示會員資料 ──
  function showMemberView({ member, orders }) {
    document.getElementById('guest-view').hidden  = true;
    document.getElementById('member-view').hidden = false;

    document.getElementById('member-name').textContent  = member.name  || '會員';
    document.getElementById('member-email').textContent = member.email;
    document.getElementById('member-phone').textContent = member.phone || '—';
    document.getElementById('member-since').textContent = member.created_at?.slice(0, 10) || '—';

    const completedOrders = orders.filter(o => o.status !== 'cancelled');
    const totalSpent = completedOrders.reduce((s, o) => s + Number(o.total), 0);
    document.getElementById('stat-order-count').textContent  = completedOrders.length;
    document.getElementById('stat-total-spent').textContent  = 'NT$' + totalSpent.toLocaleString();

    const container = document.getElementById('member-orders');
    if (!orders.length) {
      container.innerHTML = '<p class="result-msg">目前尚無訂單紀錄。</p>';
      return;
    }
    container.innerHTML = orders.map(o => `
      <a class="order-card" href="order.html?no=${o.order_no}">
        <div class="order-card-head">
          <span class="order-no">${o.order_no}</span>
          <span class="status-pill status-${o.status}">${STATUS_LABEL[o.status] || o.status}</span>
        </div>
        <p class="order-date">${o.created_at?.slice(0, 16) || ''}</p>
        <p class="order-items">${o.items.map(i => i.name).join('、')}</p>
        <p class="order-total">NT$${o.total.toLocaleString()}</p>
      </a>`).join('');
  }

  // ── 訪客查詢（手機）──
  async function queryByPhone() {
    const phone = document.getElementById('input-phone').value.trim();
    if (!phone) return;
    const btn = document.getElementById('btn-phone');
    btn.disabled = true; btn.textContent = '查詢中…';
    try {
      const res  = await fetch(`${API}/api/orders?phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      renderResults('phone-results', data.orders || []);
    } catch {
      document.getElementById('phone-results').innerHTML =
        '<p class="result-msg">查詢失敗，請稍後再試。</p>';
    } finally {
      btn.disabled = false; btn.textContent = '查詢';
    }
  }

  // ── 訪客查詢（訂單編號）──
  async function queryByOrderNo() {
    const no = document.getElementById('input-order-no').value.trim();
    if (!no) return;
    const btn = document.getElementById('btn-order-no');
    btn.disabled = true; btn.textContent = '查詢中…';
    try {
      const res  = await fetch(`${API}/api/orders/${no}`);
      const data = await res.json();
      if (data.ok) renderResults('orderno-results', [data.order]);
      else document.getElementById('orderno-results').innerHTML =
        '<p class="result-msg">找不到此訂單編號。</p>';
    } catch {
      document.getElementById('orderno-results').innerHTML =
        '<p class="result-msg">查詢失敗，請稍後再試。</p>';
    } finally {
      btn.disabled = false; btn.textContent = '查詢';
    }
  }

  function renderResults(containerId, orders) {
    const el = document.getElementById(containerId);
    if (!orders.length) {
      el.innerHTML = '<p class="result-msg">查無訂單紀錄。</p>';
      return;
    }
    el.innerHTML = orders.map(o => `
      <a class="order-card" href="order.html?no=${o.order_no}">
        <div class="order-card-head">
          <span class="order-no">${o.order_no}</span>
          <span class="status-pill status-${o.status}">${STATUS_LABEL[o.status] || o.status}</span>
        </div>
        <p class="order-date">${o.created_at?.slice(0,16) || ''}</p>
        <p class="order-items">${o.items.map(i => i.name).join('、')}</p>
        <p class="order-total">NT$${o.total.toLocaleString()}</p>
      </a>`).join('');
  }

  // ── 初始化 ──
  (async function init() {
    const savedEmail = localStorage.getItem(STORAGE_KEY);
    if (savedEmail) {
      const btn = document.getElementById('btn-email');
      btn.disabled = true;
      try {
        const res  = await fetch(`${API}/api/members/me?email=${encodeURIComponent(savedEmail)}`);
        const data = await res.json();
        if (data.ok) { showMemberView(data); return; }
        // email 已失效（例如會員資料被刪），清除並顯示訪客頁
        localStorage.removeItem(STORAGE_KEY);
      } catch {}
      btn.disabled = false;
    }
    // URL 帶訂單編號（從其他頁面跳來）
    const urlNo = new URLSearchParams(location.search).get('no');
    if (urlNo) {
      document.getElementById('input-order-no').value = urlNo;
      queryByOrderNo();
    }
  })();
</script>
</body>
