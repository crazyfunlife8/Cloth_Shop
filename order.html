<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂單確認｜品牌名稱</title>
  <meta name="theme-color" content="#FBF7F4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+TC:wght@500;600;700&family=Nunito:ital,wght@0,300..800;1,400..700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .order-page {
      max-width: 640px;
      margin: 0 auto;
      padding: 120px 20px 80px;
    }
    @media (min-width: 768px) { .order-page { padding: 140px 48px 100px; } }

    /* ── Success banner ── */
    .success-banner {
      text-align: center;
      padding: 40px 20px 32px;
      background: var(--c-surface);
      border-radius: var(--r-card);
      margin-bottom: 28px;
    }
    .success-icon {
      font-size: 56px;
      color: #27ae60;
      display: block;
      margin-bottom: 12px;
    }
    .success-title {
      font-family: 'Noto Serif TC', serif;
      font-size: 22px; font-weight: 600;
      color: var(--c-ft-dark);
      margin-bottom: 8px;
    }
    .success-sub { font-size: 14px; color: var(--c-secondary); line-height: 1.7; }
    .order-no-tag {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 16px;
      background: rgba(143,89,53,.1);
      border-radius: var(--r-pill);
      font-size: 13px; font-weight: 700;
      color: var(--c-primary);
      letter-spacing: .04em;
    }

    /* ── Card shared ── */
    .info-card {
      background: var(--c-surface);
      border-radius: var(--r-card);
      padding: 24px 28px;
      margin-bottom: 16px;
    }
    .card-title {
      font-weight: 700; font-size: 14px;
      color: var(--c-on-surface);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(143,89,53,.1);
      display: flex; align-items: center; gap: 6px;
    }
    .card-title .material-symbols-outlined { font-size: 18px; color: var(--c-primary); }

    /* ── Order meta ── */
    .meta-row {
      display: flex; justify-content: space-between;
      font-size: 13px; padding: 6px 0;
      border-bottom: 1px solid rgba(143,89,53,.06);
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-label { color: var(--c-secondary); }
    .meta-val { font-weight: 600; color: var(--c-on-surface); }
    .meta-val.price { color: var(--c-primary); }
    .status-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: var(--r-pill);
      font-size: 12px; font-weight: 700;
    }
    .status-pending  { background: rgba(230,126,34,.15); color: #c0772a; }
    .status-paid     { background: rgba(39,174,96,.15);  color: #1e8449; }
    .status-shipped  { background: rgba(41,128,185,.15); color: #1a5e8a; }
    .status-done     { background: rgba(39,174,96,.15);  color: #1e8449; }
    .status-cancelled{ background: rgba(192,57,43,.15);  color: #922b21; }

    /* ── Items list ── */
    .item-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(143,89,53,.06);
    }
    .item-row:last-child { border-bottom: none; }
    .item-thumb {
      width: 56px; height: 70px;
      border-radius: 10px; object-fit: cover;
      background: var(--c-body); flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 13px; font-weight: 600; }
    .item-meta { font-size: 12px; color: var(--c-secondary); margin-top: 2px; }
    .item-price { font-size: 14px; font-weight: 700; color: var(--c-primary); white-space: nowrap; }

    /* ── QR code card ── */
    .qr-card {
      background: var(--c-surface);
      border-radius: var(--r-card);
      padding: 28px;
      text-align: center;
      margin-bottom: 16px;
    }
    .qr-card p { font-size: 14px; color: var(--c-secondary); line-height: 1.8; margin-top: 12px; }
    .qr-img {
      width: 200px; height: 200px;
      margin: 0 auto;
      border-radius: 16px;
      object-fit: contain;
      background: #fff;
      border: 1px solid rgba(143,89,53,.15);
      padding: 8px;
    }
    .qr-amount {
      font-size: 22px; font-weight: 700;
      color: var(--c-primary);
      margin: 10px 0 4px;
    }

    /* ── CTA buttons ── */
    .cta-row { display: flex; gap: 12px; margin-top: 8px; }
    .cta-btn {
      flex: 1;
      padding: 13px;
      border-radius: var(--r-btn);
      font-size: 14px; font-weight: 700;
      text-align: center; text-decoration: none;
      cursor: pointer; border: none;
      transition: opacity .2s;
    }
    .cta-btn:hover { opacity: .85; }
    .cta-primary { background: var(--c-primary); color: #fff; }
    .cta-outline  { background: transparent; color: var(--c-primary); border: 2px solid var(--c-primary); }
  </style>
</head>
<body>

<!-- HEADER -->
<header id="site-header">
  <nav class="header-nav">
    <a href="/" class="header-logo" aria-label="品牌首頁">
      <img src="/image/cloth_logo.png" alt="Wear the Warmth">
    </a>
    <div class="header-actions">
      <a href="/" class="icon-btn" aria-label="回首頁">
        <span class="material-symbols-outlined">home</span>
      </a>
      <a href="/account.html" class="icon-btn" aria-label="會員中心">
        <span class="material-symbols-outlined">person</span>
      </a>
    </div>
  </nav>
</header>

<main class="order-page">

  <!-- 成功提示 -->
  <div class="success-banner">
    <span class="material-symbols-outlined success-icon">check_circle</span>
    <h1 class="success-title">訂單已建立！</h1>
    <p class="success-sub">感謝您的訂購，請掃描下方 QR Code 完成付款。<br>付款後截圖傳送至 LINE 客服以利核對。</p>
    <span class="order-no-tag" id="order-no-tag">ORD-…</span>
  </div>

  <!-- 訂單資訊 -->
  <div class="info-card">
    <p class="card-title"><span class="material-symbols-outlined">receipt_long</span>訂單資訊</p>
    <div class="meta-row"><span class="meta-label">訂單編號</span><span class="meta-val" id="m-no">—</span></div>
    <div class="meta-row"><span class="meta-label">訂單狀態</span><span class="meta-val" id="m-status">—</span></div>
    <div class="meta-row"><span class="meta-label">姓名</span><span class="meta-val" id="m-name">—</span></div>
    <div class="meta-row"><span class="meta-label">手機</span><span class="meta-val" id="m-phone">—</span></div>
    <div class="meta-row"><span class="meta-label">地址</span><span class="meta-val" id="m-address">—</span></div>
    <div class="meta-row"><span class="meta-label">備註</span><span class="meta-val" id="m-note">—</span></div>
  </div>

  <!-- 商品明細 -->
  <div class="info-card">
    <p class="card-title"><span class="material-symbols-outlined">shopping_bag</span>購買商品</p>
    <div id="order-items"></div>
    <div class="meta-row" style="margin-top:10px"><span class="meta-label">商品小計</span><span class="meta-val price" id="m-subtotal">—</span></div>
    <div class="meta-row"><span class="meta-label">運費</span><span class="meta-val" id="m-shipping">—</span></div>
    <div class="meta-row" style="font-size:16px"><span class="meta-label" style="font-weight:700;color:var(--c-ft-dark)">合計</span><span class="meta-val price" id="m-total" style="font-size:18px">—</span></div>
  </div>

  <!-- LINE Pay QR Code -->
  <div class="qr-card">
    <p class="card-title" style="justify-content:center;border:none;margin-bottom:8px">
      <span class="material-symbols-outlined">qr_code_2</span>LINE Pay 付款 QR Code
    </p>
    <p class="qr-amount" id="qr-amount">NT$—</p>
    <!-- ↓ 換成你的靜態 LINE Pay QR 圖片路徑 -->
    <img class="qr-img" src="/brand/line-pay-qr.png" alt="LINE Pay QR Code">
    <p>使用 LINE App → 付款 → 掃描 QR Code<br>金額請依照上方合計填寫</p>
  </div>

  <!-- 操作按鈕 -->
  <div class="cta-row">
    <a class="cta-btn cta-outline" href="index.html#shop">繼續購物</a>
    <a class="cta-btn cta-primary" id="btn-view-order" href="account.html">查看訂單</a>
  </div>

</main>

<!-- footer 由 script.js renderFooter() 動態插入 -->

<script src="script.js"></script>
<script>
  const API = 'https://brand-api.crazyfunlife8.workers.dev';

  const STATUS_LABEL = {
    pending:   '待付款',
    paid:      '已付款',
    shipped:   '已出貨',
    done:      '已完成',
    cancelled: '已取消',
  };

  async function loadOrder() {
    const no = new URLSearchParams(location.search).get('no');
    if (!no) {
      document.querySelector('.success-banner').innerHTML =
        '<span class="material-symbols-outlined" style="font-size:40px;color:var(--c-secondary)">info</span>' +
        '<p class="success-title" style="margin-top:12px">沒有訂單編號</p>' +
        '<p class="success-sub">請透過結帳流程進入此頁面，或前往 <a href="account.html" style="color:var(--c-primary)">會員中心</a> 查詢歷史訂單。</p>';
      return;
    }

    document.getElementById('order-no-tag').textContent = no;

    try {
      const res  = await fetch(`${API}/api/orders/${no}`);
      const data = await res.json();
      if (!data.ok) throw new Error('訂單不存在');
      renderOrder(data.order);
    } catch {
      document.querySelector('.success-banner').innerHTML =
        '<span class="material-symbols-outlined" style="font-size:40px;color:var(--c-secondary)">error</span>' +
        '<p style="margin-top:12px;color:var(--c-secondary)">無法載入訂單，請檢查連結是否正確。</p>';
    }
  }

  function renderOrder(o) {
    document.title = `訂單 ${o.order_no}｜品牌名稱`;

    const statusClass = `status-${o.status}`;
    document.getElementById('m-no').textContent      = o.order_no;
    document.getElementById('m-status').innerHTML    =
      `<span class="status-pill ${statusClass}">${STATUS_LABEL[o.status] || o.status}</span>`;
    document.getElementById('m-name').textContent    = o.name;
    document.getElementById('m-phone').textContent   = o.phone;
    document.getElementById('m-address').textContent = o.address;
    document.getElementById('m-note').textContent    = o.note || '（無）';
    document.getElementById('m-subtotal').textContent  = `NT$${o.subtotal.toLocaleString()}`;
    document.getElementById('m-shipping').textContent  = o.shipping_fee === 0 ? '免運' : `NT$${o.shipping_fee}`;
    document.getElementById('m-total').textContent     = `NT$${o.total.toLocaleString()}`;
    document.getElementById('qr-amount').textContent   = `NT$${o.total.toLocaleString()}`;

    const el = document.getElementById('order-items');
    o.items.forEach(item => {
      el.innerHTML += `
        <div class="item-row">
          <img class="item-thumb" src="${item.image ? `${API}/images/${item.image}` : '/placeholder.jpg'}" alt="${item.name}">
          <div class="item-info">
            <p class="item-name">${item.name}</p>
            <p class="item-meta">${[item.color,item.size].filter(Boolean).join(' / ')} × ${item.qty}</p>
          </div>
          <span class="item-price">NT$${(item.price * item.qty).toLocaleString()}</span>
        </div>`;
    });
  }

  loadOrder();

  // 讓「查看訂單」按鈕帶訂單編號過去
  const _no = new URLSearchParams(location.search).get('no');
  if (_no) document.getElementById('btn-view-order').href = `account.html?no=${_no}`;
</script>
</body>
</html>
